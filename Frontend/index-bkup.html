<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
    #display{
        display: flex;
    flex-wrap: wrap;
    gap: 16px;

    .campaign-card {

        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
        max-width:20%;
        overflow-wrap: break-word;

    #connect_btn {

    right: 16px;

    }
    h3{
        margin:0;
    }

   
    #frm_campgn {
        display: flex;
        flex-direction: column;
        max-width: 300px;          
        gap: 8px;
    }
    #frm_campgn button {
        margin-top: 8px;
        align-self: flex-start;     
    }

<body>
    <button id="connect_btn">Connect</button>
    <br>
    
    <form id="frm_campgn">
        <label for="title">Title</label>
        <input id="title"/>
        <label for="goal">Goal</label>

    </form>
    <br>
    <div id="display"></div>
